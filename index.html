<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ultimate Car Driving</title>
    <style>
      :root{
        --bg:#000;
        --fg:#fff;
        --line:rgba(255,255,255,0.15);
      }
      *{box-sizing:border-box;}
      html,body{
        margin:0;
        padding:0;
        height:100%;
        background:var(--bg);
        color:var(--fg);
        font-family:'Helvetica Neue', Arial, sans-serif;
        overflow:hidden;
      }

      .wrap{
        position:relative;
        width:100%;
        height:100%;
        display:flex;
        flex-direction:column;
      }

      header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:14px 20px;
        border-bottom:1px solid var(--line);
        flex-shrink:0;
      }
      header h1{
        font-size:13px;
        font-weight:600;
        letter-spacing:3px;
        text-transform:uppercase;
        margin:0;
      }
      header .dot{
        display:inline-block;
        width:6px;
        height:6px;
        border-radius:50%;
        background:var(--fg);
        margin-right:10px;
        vertical-align:middle;
      }
      .btn{
        background:transparent;
        border:1px solid var(--line);
        color:var(--fg);
        font-size:11px;
        letter-spacing:1.5px;
        text-transform:uppercase;
        padding:8px 14px;
        border-radius:2px;
        cursor:pointer;
        transition:background .15s ease, border-color .15s ease;
      }
      .btn:hover{
        background:var(--fg);
        color:var(--bg);
        border-color:var(--fg);
      }

      .stage{
        position:relative;
        flex:1;
        min-height:0;
      }
      iframe{
        width:100%;
        height:100%;
        border:0;
        display:block;
        background:#000;
      }

      #loadingBlock{
        position:absolute;
        inset:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:22px;
        background:var(--bg);
        z-index:5;
        transition:opacity .4s ease;
      }
      #loadingBlock.hidden{
        opacity:0;
        pointer-events:none;
      }
      .mark{
        font-size:11px;
        letter-spacing:6px;
        text-transform:uppercase;
        opacity:0.9;
      }
      .bar{
        width:240px;
        height:1px;
        background:var(--line);
        position:relative;
        overflow:hidden;
      }
      .bar::after{
        content:"";
        position:absolute;
        top:0; bottom:0; left:-40%;
        width:40%;
        background:var(--fg);
        animation:sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep{
        0%{left:-40%;}
        50%{left:60%;}
        100%{left:100%;}
      }
      #statusText{
        font-size:11px;
        opacity:0.45;
        letter-spacing:1px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1><span class="dot"></span>Ultimate Car Driving</h1>
        <button class="btn" onclick="toggleFullscreen()">Fullscreen</button>
      </header>

      <div class="stage">
        <div id="loadingBlock">
          <div class="mark">Loading</div>
          <div class="bar"></div>
          <div id="statusText">Connecting to game…</div>
        </div>
        <iframe
          id="gameFrame"
          src="https://html-online-game.github.io/ultimate-car-driving/"
          title="Ultimate Car Driving"
          allow="fullscreen; autoplay; gamepad; accelerometer"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </div>

    <script>
      const loadingBlock = document.getElementById("loadingBlock");
      const statusText = document.getElementById("statusText");
      const frame = document.getElementById("gameFrame");

      frame.addEventListener("load", () => {
        statusText.textContent = "Ready";
        setTimeout(() => loadingBlock.classList.add("hidden"), 300);
      });

      // Safety net: if the load event never fires cleanly (some iframes
      // don't report it reliably), stop showing the overlay after a bit.
      setTimeout(() => {
        if (!loadingBlock.classList.contains("hidden")) {
          statusText.textContent = "Ready";
          loadingBlock.classList.add("hidden");
        }
      }, 6000);

      function toggleFullscreen() {
        const el = document.querySelector(".stage");
        const isFull = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFull) {
          (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
        }
      }
    </script>
  </body>
</html>
