<!DOCTYPE html>
<!-- Ultimate Game Stash file -->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/ultimate%20car%20driving/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Ultimate Car Driving Game</title>
    <link rel="shortcut icon" href="TemplateData/img/favicon.ico">
    <link rel="stylesheet" href="TemplateData/css/style.css">
    <style>
      :root{
        --bg1:#0f0c29;
        --bg2:#302b63;
        --bg3:#24243e;
        --accent:#00e5ff;
        --accent2:#ff5f6d;
        --text:#f5f5f7;
      }
      html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
      #gameContainer{
        position:relative;
        width:100%;
        height:100%;
      }
      #loadingBlock{
        position:absolute;
        inset:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:28px;
        background:
          radial-gradient(circle at 20% 20%, rgba(0,229,255,0.15), transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(255,95,109,0.15), transparent 40%),
          linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
        background-size:200% 200%;
        animation:bgShift 12s ease infinite;
        font-family:'Segoe UI', Roboto, sans-serif;
        color:var(--text);
        z-index:10;
      }
      @keyframes bgShift{
        0%{background-position:0% 50%;}
        50%{background-position:100% 50%;}
        100%{background-position:0% 50%;}
      }
      #loadingBlock .logo{
        width:140px;
        height:auto;
        filter:drop-shadow(0 0 20px rgba(0,229,255,0.5));
        animation:floaty 3s ease-in-out infinite;
      }
      @keyframes floaty{
        0%,100%{transform:translateY(0);}
        50%{transform:translateY(-10px);}
      }
      .subtitle{
        font-size:14px;
        opacity:0.7;
        letter-spacing:2px;
        text-transform:uppercase;
      }
      #progressBar{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:10px;
        width:320px;
      }
      #progressBar > div:first-child{
        font-size:12px;
        letter-spacing:3px;
        opacity:0.8;
      }
      #progressLabel{
        font-size:12px;
        opacity:0.6;
        min-width:40px;
        text-align:right;
      }
      .centered{
        position:relative;
        width:100%;
        height:10px;
        border-radius:999px;
        background:rgba(255,255,255,0.08);
        overflow:hidden;
        box-shadow:inset 0 0 6px rgba(0,0,0,0.5);
      }
      #emptyBar{
        display:none;
      }
      #fullBar{
        position:absolute;
        top:0; left:0; bottom:0;
        width:0%;
        border-radius:999px;
        background:linear-gradient(90deg, var(--accent), var(--accent2));
        background-size:200% 100%;
        animation:shimmer 2s linear infinite;
        transition:width .25s ease;
        box-shadow:0 0 12px var(--accent);
      }
      @keyframes shimmer{
        0%{background-position:0% 0%;}
        100%{background-position:200% 0%;}
      }
      #statusText{
        font-size:12px;
        opacity:0.55;
        min-height:16px;
      }
      #warningBrowserBlock, #warningMobileBlock{
        text-align:center;
        max-width:360px;
        font-size:13px;
        opacity:0.8;
      }
      #errorBrowserBlock{
        position:absolute;
        inset:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:16px;
        background:#000;
        color:var(--text);
        font-family:'Segoe UI', Roboto, sans-serif;
      }
      .fs-btn{
        position:absolute;
        bottom:14px;
        right:14px;
        z-index:20;
        background:rgba(0,0,0,0.5);
        border:1px solid rgba(255,255,255,0.2);
        color:#fff;
        padding:8px 14px;
        border-radius:8px;
        font-size:12px;
        cursor:pointer;
        backdrop-filter:blur(6px);
        transition:background .2s ease;
      }
      .fs-btn:hover{background:rgba(255,255,255,0.15);}
    </style>
  </head>
  <body>

    <div class="keepRatio">
      <div id="gameContainer" class="unity-desktop webgl-content">
        <canvas id="gameCanvas"></canvas>
        <div id="loadingBlock">
          <img class="logo" src="TemplateData/img/Logo.png">
          <span class="subtitle">Ultimate Car Driving</span>

          <div id="progressBar">
            <div>LOADING</div>
            <div class="centered">
              <div id="emptyBar"></div>
              <div id="fullBar"></div>
            </div>
            <span id="progressLabel">0%</span>
          </div>
          <div id="statusText">Preparing assets…</div>

          <div id="warningBrowserBlock" style="display:none;">
            <div class="warningBrowserText">
              Your browser may not fully support this game. For best results use Chrome, Firefox, or Safari.
            </div>
          </div>
          <div id="warningMobileBlock" style="display:none;">
            <div class="warningBrowserText">
              Please note that Unity WebGL is not currently supported on mobiles.
            </div>
          </div>
        </div>

        <div id="errorBrowserBlock" style="display:none;">
          <img class="logo" src="TemplateData/img/Logo.png">
          <span class="subtitle">Your browser doesn't support WebGL</span>
          <div id="errorContent" style="display:none;">
            <div class="errorBrowserText"></div>
          </div>
        </div>

        <button class="fs-btn" onclick="ToggleFullScreen()">⛶ Fullscreen</button>
      </div>
    </div>

    <script>
      window.mergedBlobUrls = {};
      window.assetsReady = false;

      const statusText = () => document.getElementById("statusText");
      const progressLabel = () => document.getElementById("progressLabel");

      function setStatus(msg){
        const el = statusText();
        if (el) el.textContent = msg;
      }

      async function mergeSplitFile(fileUrlBase, numParts = 2) {
        const partUrls = Array.from({ length: numParts }, (_, i) =>
          `${fileUrlBase}.part${i + 1}`
        );

        try {
          setStatus("Fetching split data…");
          const responses = await Promise.all(
            partUrls.map(url => fetch(url))
          );

          if (responses.some(r => !r.ok)) {
            return null;
          }

          const parts = await Promise.all(
            responses.map(r => r.arrayBuffer())
          );

          const combinedBlob = new Blob(parts, {
            type: 'application/octet-stream'
          });

          setStatus("Assets ready");
          return URL.createObjectURL(combinedBlob);
        } catch (error) {
          return null;
        }
      }

      function setupXHRInterceptor() {
        if (window.xhrInterceptorInstalled) return;

        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSend = XMLHttpRequest.prototype.send;

        XMLHttpRequest.prototype.open = function(method, url, ...args) {
          this._url = url;
          this._method = method;
          this._args = args;

          let finalUrl = url;
          for (const [filename, blobUrl] of Object.entries(window.mergedBlobUrls)) {
            if (url.includes(filename)) {
              finalUrl = blobUrl;
              break;
            }
          }

          return originalOpen.call(this, method, finalUrl, ...args);
        };

        XMLHttpRequest.prototype.send = function(...args) {
          const xhr = this;

          if (!window.assetsReady) {
            const checkReady = setInterval(() => {
              if (window.assetsReady) {
                clearInterval(checkReady);
                originalSend.apply(xhr, args);
              }
            }, 50);
            return;
          }

          return originalSend.apply(this, args);
        };

        window.xhrInterceptorInstalled = true;
      }

      function setupFetchInterceptor() {
        if (window.fetchInterceptorInstalled) return;

        const originalFetch = window.fetch;
        window.fetch = function(url, ...args) {
          let finalUrl = url;
          for (const [filename, blobUrl] of Object.entries(window.mergedBlobUrls)) {
            if (typeof url === 'string' && url.includes(filename)) {
              finalUrl = blobUrl;
              break;
            }
          }
          return originalFetch.call(this, finalUrl, ...args);
        };

        window.fetchInterceptorInstalled = true;
      }

      async function prepareGameAssets() {
        try {
          window.assetsReady = false;
          delete window.xhrInterceptorInstalled;
          delete window.fetchInterceptorInstalled;
          window.mergedBlobUrls = {};

          setupXHRInterceptor();
          setupFetchInterceptor();

          const filesToMerge = [
            { filename: 'Build/0aff4ee936778b905d874c8c2fb40213.data.unityweb', parts: 3 }
          ];

          for (const file of filesToMerge) {
            const blobUrl = await mergeSplitFile(file.filename, file.parts);
            if (blobUrl) {
              window.mergedBlobUrls[file.filename] = blobUrl;
            }
          }

          window.assetsPrepared = true;
          window.assetsReady = true;

        } catch (error) {
          window.assetsPrepared = false;
          window.assetsReady = true;
        }
      }

      // Kick off asset prep AND the Unity loader script in parallel instead of
      // sequentially — this is what was causing the long wait before anything
      // started downloading.
      prepareGameAssets();
      initUnity();

      function ToggleFullScreen() {
        var isInFullScreen = (document.fullscreenElement && document.fullscreenElement !== null) ||
          (document.webkitFullscreenElement && document.webkitFullscreenElement !== null) ||
          (document.msFullscreenElement && document.msFullscreenElement !== null);

        var element = document.body.getElementsByClassName("webgl-content")[0];

        if (!isInFullScreen) {
          if (element.webkitRequestFullscreen) {
            element.webkitRequestFullscreen();
          } else if (element.msRequestFullscreen) {
            element.msRequestFullscreen();
          } else if (element.requestFullscreen) {
            element.requestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        }
      }

      function CheckCompatibility() {
        if (!hasWebGL()) {
          document.getElementById("errorBrowserBlock").style.display = "flex";
        } else if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
          document.getElementById("warningMobileBlock").style.display = "block";
        } else if (!isFirefox && !isSafari && !isChrome) {
          document.getElementById("warningBrowserBlock").style.display = "block";
        }
      }

      function hasWebGL() {
        var supported;
        try {
          var canvas = document.createElement('canvas');
          supported = !!window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
        } catch (e) { supported = false; }

        try {
          eval('let foo = 123;');
        } catch (e) { supported = false; }
        canvas = undefined;
        return supported;
      }

      var isFirefox = typeof InstallTrigger !== 'undefined';
      var isSafari = /constructor/i.test(window.HTMLElement) || (function (p) { return p.toString() === "[object SafariRemoteNotification]"; })(!window['safari'] || (typeof safari !== 'undefined' && safari.pushNotification));

      var isChromium = window.chrome;
      var winNav = window.navigator;
      var vendorName = winNav.vendor;
      var isOpera = typeof window.opr !== "undefined";
      var isIEedge = winNav.userAgent.indexOf("Edge") > -1;
      var isIOSChrome = winNav.userAgent.match("CriOS");
      var isChrome = isIOSChrome || (isChromium !== null && typeof isChromium !== "undefined" && vendorName === "Google Inc." && isOpera === false && isIEedge === false);

      function initUnity() {
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/fb9502bc7610d9c812fd76745164ef27.js";
        var config = {
          dataUrl: buildUrl + "/0aff4ee936778b905d874c8c2fb40213.data.unityweb",
          frameworkUrl: buildUrl + "/59f116a01ba156009be1331a920ead96.js.unityweb",
          codeUrl: buildUrl + "/c04f87f256d6238c834e76a761d263d1.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Gamebol",
          productName: "Ultimate Car Driving",
          productVersion: "1.0",
        };

        var container = document.querySelector("#gameContainer");
        var canvas = document.querySelector("#gameCanvas");
        var loadingBar = document.querySelector("#loadingBlock");
        var progressBarFull = document.querySelector("#fullBar");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";
          config.devicePixelRatio = 1;
        }
        CheckCompatibility();

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          setStatus("Loading engine…");
          createUnityInstance(canvas, config, (progress) => {
            var pct = Math.round(100 * progress);
            progressBarFull.style.width = pct + "%";
            if (progressLabel()) progressLabel().textContent = pct + "%";
            if (pct < 100) setStatus("Loading game…");
          }).then((unityInstance) => {
            setStatus("Done");
            loadingBar.style.display = "none";
          }).catch((message) => {
            setStatus("Failed to load");
            alert(message);
          });
        };
        document.body.appendChild(script);
      }
    </script>
    <script src="game.js"></script>
  </body>
</html>
