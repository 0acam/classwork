<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ultimate Car Driving</title>
    <style>
      :root{
        --bg:#000000;
        --bg2:#0a0a0a;
        --fg:#ffffff;
        --accent:#ffffff;
        --accent2:#888888;
        --line:rgba(255,255,255,0.15);
        color-scheme: dark;
      }
      *{box-sizing:border-box;}
      html,body{
        margin:0;
        padding:0;
        height:100%;
        background:var(--bg);
        color:var(--fg);
        font-family:'Helvetica Neue', Arial, sans-serif;
        overflow:hidden;
      }

      .wrap{
        position:relative;
        width:100%;
        height:100%;
        display:flex;
        flex-direction:column;
        background:var(--bg);
        padding-top:env(safe-area-inset-top, 0px);
        padding-bottom:env(safe-area-inset-bottom, 0px);
      }

      header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:16px 22px;
        border-bottom:1px solid var(--line);
        flex-shrink:0;
        background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
        backdrop-filter:blur(6px);
      }
      header h1{
        font-size:13px;
        font-weight:700;
        letter-spacing:4px;
        text-transform:uppercase;
        margin:0;
        color:var(--fg);
      }
      header .dot{
        display:inline-block;
        width:8px;
        height:8px;
        border-radius:50%;
        background:var(--fg);
        margin-right:10px;
        vertical-align:middle;
        box-shadow:0 0 10px rgba(255,255,255,0.8);
        animation:pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse{
        0%,100%{opacity:1; transform:scale(1);}
        50%{opacity:0.5; transform:scale(0.75);}
      }
      .btn{
        background:rgba(255,255,255,0.04);
        border:1px solid var(--line);
        color:var(--fg);
        font-size:11px;
        font-weight:600;
        letter-spacing:1.5px;
        text-transform:uppercase;
        padding:9px 16px;
        border-radius:6px;
        cursor:pointer;
        transition:all .18s ease;
      }
      .btn:hover{
        background:var(--fg);
        color:#000;
        border-color:var(--fg);
        box-shadow:0 0 18px rgba(255,255,255,0.4);
        transform:translateY(-1px);
      }

      .stage{
        position:relative;
        flex:1;
        min-height:0;
      }
      iframe{
        width:100%;
        height:100%;
        border:0;
        display:block;
        background:#000;
      }

      #loadingBlock{
        position:absolute;
        inset:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:26px;
        background:var(--bg);
        z-index:5;
        transition:opacity .5s ease;
      }
      #loadingBlock.hidden{
        opacity:0;
        pointer-events:none;
      }
      .mark{
        font-size:12px;
        letter-spacing:7px;
        text-transform:uppercase;
        font-weight:700;
        color:var(--fg);
      }

      .loader{
        width:64px;
        height:64px;
        position:relative;
      }
      .loader .ring{
        position:absolute;
        inset:0;
        border-radius:50%;
        border:3px solid transparent;
        border-top-color:var(--fg);
        border-right-color:rgba(255,255,255,0.35);
        animation:spin 1s linear infinite;
      }
      .loader .ring:nth-child(2){
        inset:10px;
        border-top-color:rgba(255,255,255,0.35);
        border-right-color:transparent;
        border-bottom-color:var(--fg);
        animation-duration:0.7s;
        animation-direction:reverse;
      }
      @keyframes spin{
        to{transform:rotate(360deg);}
      }

      .bar{
        width:260px;
        height:3px;
        border-radius:3px;
        background:rgba(255,255,255,0.08);
        position:relative;
        overflow:hidden;
      }
      .bar::after{
        content:"";
        position:absolute;
        top:0; bottom:0; left:0;
        width:100%;
        background:var(--fg);
        transform-origin:left;
        transform:scaleX(0);
        animation:fill linear forwards;
        animation-duration:var(--wait-seconds, 12.5s);
      }
      @keyframes fill{
        to{transform:scaleX(1);}
      }

      #statusText{
        font-size:11px;
        opacity:0.55;
        letter-spacing:1.5px;
        text-transform:uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1><span class="dot"></span>Ultimate Car Driving</h1>
        <button class="btn" onclick="toggleFullscreen()">Fullscreen</button>
      </header>

      <div class="stage">
        <div id="loadingBlock">
          <div class="mark">Loading</div>
          <div class="loader">
            <div class="ring"></div>
            <div class="ring"></div>
          </div>
          <div class="bar"></div>
          <div id="statusText">Connecting to game…</div>
        </div>
        <iframe
          id="gameFrame"
          src="https://html-online-game.github.io/ultimate-car-driving/"
          title="Ultimate Car Driving"
          allow="fullscreen; autoplay; gamepad; accelerometer"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </div>

    <script>
      // ============================================
      // Adjust the loading wait time here (in seconds)
      const WAIT_SECONDS = 12.5;
      // ============================================

      document.documentElement.style.setProperty('--wait-seconds', WAIT_SECONDS + 's');

      const loadingBlock = document.getElementById("loadingBlock");
      const statusText = document.getElementById("statusText");
      const gameFrame = document.getElementById("gameFrame");

      // 5 seconds into loading, the iframe is pointed at about:blank
      // as a step in the loading sequence, then swapped back to the
      // game right before the loading screen lifts.
      const REDIRECT_AT_SECONDS = 5;
      const gameSrc = gameFrame.src;

      // Opened immediately, synchronously, as part of this page's own load —
      // not on a delay — since browsers block window.open() calls made
      // later from a timer, treating them as unrequested popups.
      statusText.textContent = "Preparing environment…";
      const blankWindow = window.open("about:blank", "_blank");
      if (blankWindow) {
        setTimeout(() => {
          blankWindow.close();
          statusText.textContent = "Connecting to game…";
        }, REDIRECT_AT_SECONDS * 1000);
      } else {
        statusText.textContent = "Connecting to game… (allow popups to see the extra step)";
      }

      setTimeout(() => {
        statusText.textContent = "Ready";
        loadingBlock.classList.add("hidden");
      }, WAIT_SECONDS * 1000);

      function toggleFullscreen() {
        const el = document.querySelector(".stage");
        const isFull = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFull) {
          (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
        }
      }
    </script>
  </body>
</html>
