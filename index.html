<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Norwalk PS</title> 
<link rel="icon" type="image/png" href="https://myapps.classlink.com/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000; --fg:#fff; --dim:rgba(255,255,255,.42); --faint:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%; width:100%;}
  body{
    background:var(--bg); color:var(--fg); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    min-height:100svh; min-height:100dvh;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  /* faint grid backdrop */
  .grid{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center, black 10%, transparent 70%);
  }

  .corner{
    position:fixed; font-family:'JetBrains Mono',monospace;
    font-size:clamp(8px, 1.6vw, 10px); letter-spacing:.1em; color:var(--faint); z-index:2;
    white-space:nowrap;
  }
  .corner.tl{top:max(20px, env(safe-area-inset-top)); left:max(20px, env(safe-area-inset-left));}
  .corner.tr{top:max(20px, env(safe-area-inset-top)); right:max(20px, env(safe-area-inset-right)); text-align:right;}
  .corner.bl{bottom:max(20px, env(safe-area-inset-bottom)); left:max(20px, env(safe-area-inset-left));}
  .corner.br{bottom:max(20px, env(safe-area-inset-bottom)); right:max(20px, env(safe-area-inset-right)); text-align:right;}
  .corner .dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--fg); margin-right:6px; animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

  /* hide corner telemetry only when the viewport is too cramped for it, not by device type */
  @media (max-width:360px), (max-height:380px){
    .corner{display:none;}
  }

  .panel{
    position:relative; z-index:1;
    width:min(380px, 100%);
    max-height:100%;
    overflow:auto;
    border:1px solid var(--line); border-radius:10px;
    padding:clamp(24px, 6vw, 44px) clamp(20px, 5vw, 36px) clamp(20px, 4vw, 32px);
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0));
    backdrop-filter:blur(6px);
    opacity:0; transform:translateY(10px);
    animation:panelIn .6s ease forwards;
  }
  @keyframes panelIn{to{opacity:1;transform:translateY(0);}}

  .mark{
    display:flex; align-items:center; gap:10px; margin-bottom:clamp(22px, 5vw, 34px);
  }
  .mark .sq{
    width:10px; height:10px; background:var(--fg); flex-shrink:0;
    animation:rotateSq 2.4s ease-in-out infinite;
  }
  @keyframes rotateSq{0%,100%{transform:rotate(0);}50%{transform:rotate(135deg);}}
  .mark span{
    font-family:'JetBrains Mono',monospace; font-size:clamp(9px, 2.2vw, 11px); letter-spacing:.3em; text-transform:uppercase; color:var(--dim);
  }

  .status-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px;
  }
  .status-row h1{
    font-size:clamp(17px, 4.5vw, 22px); font-weight:600; letter-spacing:-.01em;
  }
  .status-row .pct{
    font-family:'JetBrains Mono',monospace; font-size:clamp(11px, 2.6vw, 13px); color:var(--dim); font-variant-numeric:tabular-nums; flex-shrink:0;
  }

  .progress-track{
    width:100%; height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:14px;
  }
  .progress-bar{
    height:100%; width:0%; background:var(--fg); border-radius:2px;
    box-shadow:0 0 10px rgba(255,255,255,.5);
    animation:load 2.1s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes load{0%{width:0;}55%{width:62%;}100%{width:100%;}}

  .log{
    font-family:'JetBrains Mono',monospace; font-size:clamp(9px, 2.2vw, 11px); color:var(--faint);
    min-height:16px; margin-bottom:clamp(18px, 5vw, 30px); line-height:1.6;
  }
  .log span{opacity:0; animation:logFade .5s ease forwards;}
  .log span:nth-child(1){animation-delay:.1s;}
  .log span:nth-child(2){animation-delay:.9s;}
  .log span:nth-child(3){animation-delay:1.6s;}
  @keyframes logFade{to{opacity:1;}}
  .log span::before{content:'> '; color:var(--dim);}

  .divider{height:1px; background:var(--line); margin-bottom:clamp(16px, 4vw, 24px);}

  .btn-wrap{
    display:flex; justify-content:flex-end;
    opacity:0; transform:translateY(6px);
    animation:reveal .45s ease 2.15s forwards;
  }
  @keyframes reveal{to{opacity:1;transform:translateY(0);}}

  .open-btn{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--fg); color:#000; border:none;
    padding:clamp(10px, 2.6vw, 12px) clamp(18px, 5vw, 24px);
    font-family:'Inter',sans-serif; font-size:clamp(12px, 2.8vw, 13px); font-weight:600;
    letter-spacing:.03em; border-radius:6px; cursor:pointer;
    transition:transform .18s ease, box-shadow .25s ease, gap .2s ease;
    touch-action:manipulation;
  }
  .open-btn svg{width:13px; height:13px; flex-shrink:0; transition:transform .2s ease;}
  .open-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 28px rgba(255,255,255,.18); gap:14px; }
  .open-btn:hover svg{ transform:translateX(2px); }
  .open-btn:active{ transform:translateY(0); }

  /* very short / landscape-phone frames: tighten vertical rhythm */
  @media (max-height:460px){
    .panel{ padding-top:16px; padding-bottom:14px; }
    .mark{ margin-bottom:14px; }
    .log{ margin-bottom:14px; }
    .divider{ margin-bottom:14px; }
  }

  /* ultra-narrow embeds (e.g. small iframes) */
  @media (max-width:220px){
    .mark span{ letter-spacing:.15em; }
    .status-row{ flex-direction:column; align-items:flex-start; gap:4px; }
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="corner tl"><span class="dot"></span>RPL / SYSTEM</div>
  <div class="corner tr">BUILD 2026.10</div>
  <div class="corner bl">STATUS: ONLINE</div>
  <div class="corner br" id="clock">--:--:--</div>

  <div class="panel">
    <div class="mark"><div class="sq"></div><span>RPL Network</span></div>

    <div class="status-row">
      <h1>Preparing session</h1>
      <span class="pct" id="pct">0%</span>
    </div>

    <div class="progress-track"><div class="progress-bar"></div></div>

    <div class="log">
      <span>Resolving environment</span><br>
      <span>Syncing league data</span><br>
      <span>Ready</span>
    </div>

    <div class="divider"></div>

    <div class="btn-wrap">
      <button class="open-btn" onclick="openSite()">
        Enter
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

<script>
  // percentage readout synced with progress bar
  const pctEl = document.getElementById('pct');
  const start = performance.now();
  const duration = 2100;
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = t < 0.55 ? (t/0.55)*62 : 62 + ((t-0.55)/0.45)*38;
    pctEl.textContent = Math.round(Math.min(100, eased)) + '%';
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // live clock
  function updateClock(){
    const el = document.getElementById('clock');
    const d = new Date();
    el.textContent = d.toTimeString().slice(0,8);
  }
  updateClock();
  setInterval(updateClock, 1000);

  function openSite() {
    const url = "https://html-online-game.github.io/ultimate-car-driving/";
    const popup = window.open("about:blank", "_blank");
    popup.document.open();
    popup.document.write(`
      <!DOCTYPE html>
      <html>
        <head>
          <title>Home</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 100%; height: 100%; overflow: hidden; }
            iframe { width: 100vw; height: 100vh; border: none; display: block; }
          </style>
        </head>
        <body>
          <iframe src="${url}" allowfullscreen></iframe>
        </body>
      </html>
    `);
    popup.document.close();
  }
</script>
</body>
</html>
